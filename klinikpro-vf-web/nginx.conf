server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (React Router maneja el resto en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (Vite) — cache larga y segura.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

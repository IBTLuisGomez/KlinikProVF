server:
  port: 8081

spring:
  application:
    name: klinikpro-vf
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/klinikpro}
    username: ${DB_USERNAME:klinik}
    password: ${DB_PASSWORD:klinik_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Mexico_City
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # "when-authorized" = el detalle completo (DB, disco, etc.) solo lo ve
      # una petición autenticada con rol admin; anónimo solo ve UP/DOWN.
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  version: VF1-1.0.0
  cors:
    # "null" (origen de un archivo .html abierto con file://) ya no hace falta:
    # el frontend real corre en Vite (5173) o en el contenedor nginx (5173) — ambos http real.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173}

agenda:
  min-lead-minutes: 120        # anticipación mínima para agendar (2h, ajustable por especialidad más adelante)
  max-lead-days: 60            # anticipación máxima
  cancellation-min-hours: 24   # plazo para cancelar sin cargo
  no-show-tolerance-minutes: 15
  no-show-check-interval-ms: 300000   # cada 5 min el job barre citas vencidas (CU-08 automático)

caja:
  card-commission-rate: 0.035   # 3.5% comisión de terminal, se suma al total (la absorbe el cliente)

security:
  jwt:
    # Default solo para dev local; en producción SIEMPRE se debe fijar JWT_SECRET
    # como variable de entorno (64+ caracteres aleatorios, nunca el valor de este default).
    secret: ${JWT_SECRET:CAMBIA_ESTO_por_una_cadena_larga_de_al_menos_64_caracteres_aleatorios_1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    systems.cytohelix: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:klinikpro;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

security:
  jwt:
    secret: "test-secret-key-for-unit-tests-only-min-32-chars-xx"
    expiration-ms: 3600000
